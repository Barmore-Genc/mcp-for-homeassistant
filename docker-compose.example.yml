services:
  mcp-for-homeassistant:
    image: ghcr.io/barmore-genc/mcp-for-homeassistant:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HA_URL: http://homeassistant:8123
      HA_TOKEN: ${HA_TOKEN}
      MCP_ORIGIN: https://ha-mcp.example.com
      MCP_USERNAME: you
      MCP_PASSWORD: ${MCP_PASSWORD}
      # Sign in through an OpenID Connect provider instead of a password.
      # Remove MCP_USERNAME and MCP_PASSWORD when using it.
      # MCP_OIDC_ISSUER: https://id.example.com
      # MCP_OIDC_CLIENT_ID: mcp-for-homeassistant
      # MCP_OIDC_PROVIDER_NAME: Pocket ID
      # MCP_OIDC_ALLOWED_EMAILS: you@example.com
      # MCP_SIGNING_KEY: ${MCP_SIGNING_KEY}
      # MCP_READ_ONLY: "true"
